name: Integration

# Device-backed integration tests for the sample app (example/integration_test).
# Boots a real Android emulator + iOS simulator and drives the canonical sample
# shell end-to-end.
#
# Started as NON-BLOCKING (`continue-on-error: true` on both device jobs) per
# the refactor plan — promote to a required check after two green weeks. The
# tests are designed to pass WITHOUT secrets: the sample launches + navigates
# even when no OCTOPUS_API_KEY is injected, so these jobs assert host-shell
# structure + navigation, never backend results.
#
# Runner: the self-hosted macOS mac mini (label `self-hosted`), like the rest of
# CI — GitHub-hosted minutes are capped at the org level. The iOS simulator is
# native to the Mac; the Android emulator path is best-effort here (a Mac is not
# a natural Android-emulator host — system-image arch follows the runner CPU,
# and these jobs stay non-blocking while that stabilises on the real runner).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Integration tests (Android emulator)
    runs-on: [self-hosted]
    # Non-blocking until promoted to required (refactor plan chunk #19).
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      - name: Clear stale pub.dev token (self-hosted runner hygiene)
        # The release workflow's OIDC step (dart-lang/setup-dart) writes an
        # `--env-var PUB_TOKEN` pub.dev entry into the persistent user-level
        # pub-tokens.json. On a self-hosted runner that file survives between
        # jobs, so every later `flutter pub get` aborts with "requires
        # PUB_TOKEN but not defined" (exit 65). Drop it first — fetching public
        # deps needs no token. `|| true` makes it a no-op when nothing is set.
        run: dart pub token remove https://pub.dev || true

      - name: Resolve example dependencies
        working-directory: example
        # Self-heal a corrupt shared ~/.pub-cache on the self-hosted runner: a
        # truncated/partial cached download makes pub get fail its hash check. On
        # failure, clear the cache and re-resolve once — a non-zero pub get is
        # never benign, so retrying here is safe (unlike the device test step,
        # which can exit non-zero for harmless reasons). Compile-time cache
        # staleness from SDK drift is handled separately by pinning Flutter above.
        # The clean wipes the SHARED cache, so it could in theory race a
        # concurrent pr.yml `flutter pub get` on the same mini — but it only
        # fires when the cache is already bad, and pr.yml recovers via its
        # GitHub-hosted fallback, so the blast radius stays bounded.
        run: |
          if ! flutter pub get; then
            echo "::warning::pub get failed on the shared self-hosted cache — clearing it and retrying once"
            dart pub cache clean --force
            flutter pub get
          fi

      - name: Write a dummy google-services.json
        # The example wires firebase_messaging (push-notification demo), whose
        # Gradle plugin hard-requires a google-services.json at assemble time.
        # The real file is gitignored (it carries a project's FCM config), so CI
        # has none. This placeholder has valid structure + dummy ids — enough to
        # satisfy the Gradle plugin; the integration suite never exercises FCM.
        run: |
          cat > example/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "octopus-sdk-flutter-example",
              "storage_bucket": "octopus-sdk-flutter-example.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.octopuscommunity.sdk.flutter.sample"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY0000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Select the emulator system-image arch for this runner
        # On Apple Silicon the x86_64 system image won't boot — the emulator
        # needs an arm64-v8a image. Pick by the runner CPU so the same workflow
        # works whether the mac mini is Apple Silicon or Intel. (The previous
        # hosted-Linux KVM-enable step is gone — it was Linux-only.)
        id: emu
        run: |
          case "$(uname -m)" in
            arm64) echo "arch=arm64-v8a" >> "$GITHUB_OUTPUT" ;;
            *)     echo "arch=x86_64"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: ${{ steps.emu.outputs.arch }}
          profile: pixel_6
          working-directory: example
          # Headless-CI emulator flags (reactivecircus-recommended): software
          # GPU + no-window/no-audio/no-boot-anim keep it stable in CI.
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          # No API key injected on purpose — the suite asserts shell structure,
          # not backend results (see sdk_integration_test.dart header).
          # `-d emulator-5554`: the persistent self-hosted mac mini also exposes
          # iOS simulators, macOS, and Chrome to Flutter. Without a device
          # selector the runner aborts with "More than one device connected"
          # before any test runs. Mirrors the iOS job's `-d "$SIM_UDID"` line.
          # NOTE: android-emulator-runner runs `script` line-by-line (each line
          # is its own `sh -c`), so multi-line shell control flow (if/then/fi)
          # breaks here — keep this a single command. Cache corruption is guarded
          # upstream (Flutter pin + pub-get self-heal), not retried around the
          # device run: a device test can exit non-zero for harmless reasons
          # (e.g. simulator/emulator app-teardown races) and a blind retry would
          # turn a green run red.
          script: flutter test integration_test -d emulator-5554

  ios:
    name: Integration tests (iOS ${{ matrix.dependency-manager }})
    runs-on: [self-hosted]
    # Non-blocking until promoted to required (refactor plan chunk #19).
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      # The plugin ships BOTH a podspec and a Package.swift (SPM/CocoaPods
      # dual-support), so exercise each iOS dependency-manager path. fail-fast
      # off so one path failing doesn't cancel the other.
      fail-fast: false
      matrix:
        dependency-manager: [cocoapods, spm]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      - name: Select the iOS dependency manager
        # Pin the example to the path this matrix leg exercises. The plugin
        # supports both: SPM (Flutter's default since 3.44, resolves the native
        # SDK via octopus-sdk-swift) and CocoaPods (the podspec, still supported).
        run: |
          if [ "${{ matrix.dependency-manager }}" = "spm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Clear stale pub.dev token (self-hosted runner hygiene)
        # The release workflow's OIDC step (dart-lang/setup-dart) writes an
        # `--env-var PUB_TOKEN` pub.dev entry into the persistent user-level
        # pub-tokens.json. On a self-hosted runner that file survives between
        # jobs, so every later `flutter pub get` aborts with "requires
        # PUB_TOKEN but not defined" (exit 65). Drop it first — fetching public
        # deps needs no token. `|| true` makes it a no-op when nothing is set.
        run: dart pub token remove https://pub.dev || true

      - name: Resolve example dependencies
        working-directory: example
        # Self-heal a corrupt shared ~/.pub-cache on the self-hosted runner: a
        # truncated/partial cached download makes pub get fail its hash check. On
        # failure, clear the cache and re-resolve once — a non-zero pub get is
        # never benign, so retrying here is safe (unlike the device test step,
        # which can exit non-zero for harmless reasons). Compile-time cache
        # staleness from SDK drift is handled separately by pinning Flutter above.
        # The clean wipes the SHARED cache, so it could in theory race a
        # concurrent pr.yml `flutter pub get` on the same mini — but it only
        # fires when the cache is already bad, and pr.yml recovers via its
        # GitHub-hosted fallback, so the blast radius stays bounded.
        run: |
          if ! flutter pub get; then
            echo "::warning::pub get failed on the shared self-hosted cache — clearing it and retrying once"
            dart pub cache clean --force
            flutter pub get
          fi

      - name: Refresh CocoaPods CDN cache
        # Only needed on the CocoaPods leg — on the SPM leg the native Octopus
        # SDK comes from octopus-sdk-swift (SPM), not the pod CDN.
        if: matrix.dependency-manager == 'cocoapods'
        # CocoaPods checks for new podspec versions only during `pod repo
        # update` — the per-`pod install` path falls back to locally-cached
        # versions ("Returning local because checking is only performed in
        # repo update"). On the persistent self-hosted runner the CDN cache
        # accumulates and falls behind newly-published native SDK versions
        # (e.g. OctopusCommunity 1.12.2 vs a cached 1.12.1), causing the
        # next `flutter test`'s auto-`pod install` to fail with "CocoaPods's
        # specs repository is too out-of-date".
        run: pod repo update

      - name: Create and boot a dedicated iPhone simulator
        id: sim
        # Give THIS job its own throwaway simulator instead of booting the first
        # shared one. The persistent self-hosted mac runs multiple runner agents
        # off one CoreSimulator device set, so the two matrix legs (and any
        # concurrent PR run) all picked the SAME device with the old step. Two
        # `flutter test` processes then attached to one device's VM service and
        # fought over one DDS/app, producing the intermittent reds we saw:
        # "A DDS instance is already connected", "found nothing to terminate",
        # and "0 tests passed / No tests were found" — all despite every test
        # passing on-device. A per-job device isolates them; the cleanup step
        # below deletes it (kept `if: always()` so a red run still tidies up).
        run: |
          # Derive the device type + runtime from an available iPhone so the
          # created device is guaranteed bootable on this runner's Xcode.
          simspec="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("deviceTypeIdentifier"):
                      print(d["deviceTypeIdentifier"], runtime)
                      sys.exit(0)
          ' || true)"
          devtype="${simspec%% *}"
          runtime="${simspec##* }"
          if [ -z "$simspec" ] || [ -z "$devtype" ] || [ -z "$runtime" ]; then
            echo "No bootable iPhone device type/runtime on this runner." >&2
            exit 1
          fi
          # run_id+run_attempt+leg → a name unique to this job execution, so
          # concurrent legs/PRs never collide and re-runs get a fresh device.
          name="octopus-ci-${{ matrix.dependency-manager }}-${{ github.run_id }}-${{ github.run_attempt }}"
          udid="$(xcrun simctl create "$name" "$devtype" "$runtime")"
          # Record the UDID for the cleanup step BEFORE booting: if boot or
          # bootstatus fails, the device already exists and the `if: always()`
          # cleanup must still be able to delete it (else it leaks — the exact
          # case the cleanup is there to prevent).
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Created $name ($udid) [$devtype / $runtime]"
          xcrun simctl boot "$udid"
          # boot is async (returns while still "Booting"); block until fully
          # booted so the test step doesn't race a half-up simulator.
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run integration tests on the simulator
        working-directory: example
        # No API key injected on purpose (see Android job). The wrapper runs the
        # suite once (no retry — a blind retry turned a green run red in PR #162)
        # and only rewrites a non-zero exit to success when every test passed but
        # flutter hit the benign iOS-simulator post-test teardown race (the app
        # exited before flutter's `simctl terminate`, so it "found nothing to
        # terminate" and re-raised it as an "unhandled error during finalization
        # of test"). It never masks a real test failure — full rationale + the
        # exact match conditions are in the script header.
        run: bash "$GITHUB_WORKSPACE/scripts/ci-run-integration-tests.sh" "$SIM_UDID"

      - name: Delete the dedicated simulator
        # Always, so a failed run doesn't leak a device onto the persistent
        # runner (leftover booted devices are what caused the collisions above).
        if: always()
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          if [ -n "$udid" ]; then
            xcrun simctl shutdown "$udid" || true
            xcrun simctl delete "$udid" || true
          fi
