name: octopus_sdk_flutter_example
description: "Demonstrates how to use the octopus_sdk_flutter plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.13.1+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  octopus_sdk_flutter: ^1.15.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase Messaging — used on Android to deliver push notifications via FCM.
  # iOS uses the native APNs path wired in AppDelegate.swift; Firebase is not
  # initialized on iOS in this example.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Displays a system notification for incoming Octopus pushes. Octopus sends
  # data-only FCM messages (so Android doesn't auto-display them) and, in a
  # Flutter app, the firebase_messaging plugin's service receives the message
  # instead of the native Octopus MessagingService — so the host must render
  # the notification itself.
  flutter_local_notifications: ^18.0.1

  # Persists the chosen demo config so a relaunch restores the last session
  # (and so a cold-start push can deep-link — the main shell only mounts once a
  # config exists). Reset clears it. See app_state.dart.
  shared_preferences: ^2.3.0

  # HMAC-SHA256 + base64url helpers used by `BridgeTokenSigner` to sign the
  # per-call bridge fingerprint passed to `fetchOrCreateClientObjectRelatedPost`
  # — demo-only, mirrors iOS `TokenProvider.swift` which uses `CryptoKit.HMAC`.
  crypto: ^3.0.0

  # Reads the installed build's real version/build number from platform
  # metadata (Info.plist / AndroidManifest — the same source Xcode/Gradle
  # stamp at build time), for the `settings-version-label` footer (D7.1,
  # cadrage report 07; wiring corrected by report 18's D5). Replaces a
  # hand-kept string constant that had no automated link to `version:` below
  # and could silently drift from it — see `octopus_demo_config.dart` history.
  package_info_plus: ^8.1.2
  in_app_update: ^4.2.5
  # Outbound links (Send feedback, About → Design reference, the Community tab's
  # mailto: shortcut) go through `widgets/open_url.dart`, which falls back to the
  # clipboard when nothing on the device claims the URL.
  url_launcher: ^6.3.2
  # PINNED, and not by preference — `url_launcher_android` 6.3.30 declares
  # `androidx.core:core:1.17.0`, which refuses to build under an Android Gradle
  # plugin older than 8.9.1. This sample pins AGP **8.7.3**
  # (`android/settings.gradle.kts`), so letting the platform implementation float
  # fails `flutter build apk` outright — not at runtime, at Gradle configuration:
  #
  #   Dependency 'androidx.core:core:1.17.0' requires Android Gradle plugin
  #   8.9.1 or higher. This build currently uses Android Gradle plugin 8.7.3.
  #
  # 6.3.23 is the newest release still on `androidx.core:core:1.13.1`. Pinned
  # here rather than bumping AGP because the AGP version is shared with the
  # release pipeline and belongs to its own change, not to a sample-UI one.
  #
  # ⚠ Unpin — delete these two lines — as soon as AGP moves to >= 8.9.1. Leaving
  # the pin behind would silently hold the sample on a stale url_launcher.
  url_launcher_android: 6.3.23

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Declared for `test/demo_config_persistence_test.dart`, which mocks the
  # `plugins.flutter.io/shared_preferences` channel directly to simulate a
  # transient read failure. It resolves transitively through
  # `shared_preferences` anyway -- and `^2.4.0` is no tighter than what that
  # package already requires -- but the test imports
  # `MethodChannelSharedPreferencesStore` and is coupled to its `getAll`/
  # `remove` channel shape. Declaring the import keeps
  # `depend_on_referenced_packages` guarding it, and keeps the test resolving
  # if `shared_preferences` ever drops that transitive edge (#377).
  shared_preferences_platform_interface: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
