name: Bug report
description: Report a problem with the Octopus Flutter SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can — a minimal repro is the fastest path to a fix.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps. A code snippet or a link to a repro repo is ideal.
      placeholder: |
        1. Initialize the SDK with '...'
        2. Call '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error message / stack trace if any.
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The `octopus_sdk_flutter` version from your pubspec.lock.
      placeholder: "1.11.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s)
      multiple: true
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `flutter doctor -v` and the device/OS version.
      render: shell
    validations:
      required: false
